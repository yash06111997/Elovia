appId: com.elovia.app
name: Seven-step onboarding and plan preview
---
- launchApp:
    clearState: true
- assertVisible: Welcome
- tapOn: Continue to About You
- tapOn: Continue to Your Goals
- tapOn: Continue to Workout Preferences
- tapOn: Continue to Available Equipment
- tapOn: Continue to Diet & Nutrition
- tapOn: Continue to Health Habits
- assertVisible: 7/7
