appId: com.elovia.app
name: Planned workout feedback and adaptation
---
- launchApp
- tapOn: Workouts
- tapOn:
    text: Start
    index: 0
- assertVisible: "Active:*"
- tapOn: Finish
- assertVisible: Post-workout check-in
- tapOn: "How hard was it?: 6"
- tapOn: "Pain during training: 1"
- tapOn: "Enjoyment: 5"
- tapOn: "Ready for next time?: 5"
- tapOn: Save workout feedback
- assertVisible: Workout saved
- tapOn: Done
